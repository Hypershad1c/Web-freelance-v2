name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: domify
          POSTGRES_PASSWORD: domify
          POSTGRES_DB: domify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domify -d domify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://domify:domify@localhost:5432/domify
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install browser for smoke checks
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: nohup npm run start > /tmp/domify-next.log 2>&1 &

      - name: Wait for health probe
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/domify-next.log
          exit 1

      - name: Browser regression checks
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --project=desktop-chromium --project=iphone-chromium
